function popHtml(d){
  const reg = LANG==='ko'?d.region_ko:d.region_en;
  const sts = (LANG==='ko'?d.titles_ko:d.titles_en).map(t=>`<div class="st">· ${t}</div>`).join('');

    <div class="reg">${reg}</div>${sts}
    <a href="${d.audio}">${listen}</a></div>`;
}

function renderGrid(){
  const g = document.getElementById('grid');
  g.innerHTML = DATA.filter(d=>d.theme).map(d=>{
    const reg = LANG==='ko'?d.region_ko:d.region_en;
    const sts = (LANG==='ko'?d.titles_ko:d.titles_en).map(t=>`<div class="st">· ${t}</div>`).join('');

    return `<div class="card"><div class="vol">VOL.${String(d.no).padStart(2,'0')}</div>
      <div class="reg">${reg}</div>${sts}<a href="${d.audio}">${listen}</a></div>`;
  }).join('');
}

  document.querySelectorAll('[data-ko]').forEach(e=>{e.textContent=e.getAttribute('data-'+l);});
  markers.forEach(m=>m.setPopupContent(popHtml(m._d)));
  renderGrid();
}
renderGrid();
