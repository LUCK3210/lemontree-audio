<!doctype html><html lang="ko"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>할아버지 목소리 고르기 2</title>
<style>body{font-family:-apple-system,sans-serif;background:#faf4e6;color:#4a3426;text-align:center;padding:28px}
h1{font-size:21px;line-height:1.4}.r{margin:20px auto;max-width:440px}
button{font-size:19px;padding:16px 20px;border:none;border-radius:14px;background:#6b4a2c;color:#fff;width:100%}
p{color:#8a6a4c}small{color:#a98b6b}</style>
<h1>솔 할아버지<br>"숨 쉬는 일도 음악이 된단다."</h1>
<p>이번엔 <b>성대 울림까지 낮춰</b> 진짜 할아버지로 만들었어</p>
<div class="r"><button onclick="play('a')">▶ ① 포근한 할아버지</button><br><small>깊고 따뜻한 톤</small><audio id="a" src="gp_old1.mp3"></audio></div>
<div class="r"><button onclick="play('b')">▶ ② 연세 많은 할아버지</button><br><small>더 낮고 살짝 떨리는 톤</small><audio id="b" src="gp_old2.mp3"></audio></div>
<hr style="margin:24px 0;border:none;border-top:1px solid #e0d2b8">
<div class="r"><button style="background:#b0926e" onclick="play('c')">▶ (참고) 예전 아저씨 톤</button><audio id="c" src="gp_a.mp3"></audio></div>
<script>function play(id){var a=document.getElementById(id);a.currentTime=0;a.play();}</script>
